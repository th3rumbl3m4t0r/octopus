[package]
name = "octopus-web"
description = "Octopus web UI: status, leases, firewall counters, config edit with commit-confirm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "octopus-web"
path = "src/main.rs"

[dependencies]
octopus-config.workspace = true
ipnet.workspace = true
schemars.workspace = true
octopus-render.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
libc.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "json", "form", "query", "tokio"] }
tokio = { version = "1", features = ["rt", "net", "macros", "process", "time", "sync", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1", "service"] }
bcrypt = "0.19"
getrandom = "0.3"
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
