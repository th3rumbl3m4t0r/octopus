# Octopus: the web UI (user _octoweb) may run exactly these octopus commands
# as root. doas matches the arguments exactly; nothing else is allowed.
# The analyzer's one-shot capture reads the request _octoweb staged; a
# Wi-Fi passphrase likewise (wifi_* keys only, never read back).
permit nopass _octoweb as root cmd /usr/local/sbin/octopus args status --json
permit nopass _octoweb as root cmd /usr/local/sbin/octopus args diff --staged
permit nopass _octoweb as root cmd /usr/local/sbin/octopus args apply --staged
permit nopass _octoweb as root cmd /usr/local/sbin/octopus args confirm
permit nopass _octoweb as root cmd /usr/local/sbin/octopus args rollback
permit nopass _octoweb as root cmd /usr/local/sbin/octopus-analyzer args --oneshot /var/octopus/staged/capture.json
permit nopass _octoweb as root cmd /usr/local/sbin/octopus args ap push
permit nopass _octoweb as root cmd /usr/local/sbin/octopus args ap push --force
permit nopass _octoweb as root cmd /usr/local/sbin/octopus args secret --staged
permit nopass _octoweb as root cmd /usr/local/sbin/octopus args guard release --staged
